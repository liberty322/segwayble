publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  flutter_blue_plus: ^2.2.1
  pointycastle: ^4.0.0
  crypto: ^3.0.5
  convert: ^3.1.1
  talker: ^5.1.16
  talker_flutter: ^5.1.16
  geolocator: ^14.0.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  fl_chart: ^0.70.0
  mobile_scanner: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
