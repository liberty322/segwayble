name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "lib/**"
      - "ios/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned .ipa (device arm64)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本项目 .metadata 锁定的 revision db50e201 对应 Flutter 3.41.6（Dart 3.11.4），
      # 与 pubspec.yaml 的 sdk: ^3.11.4 精确匹配。不要放开成 channel: stable，
      # 否则会拉到更新的 stable，插件约束可能解不动。
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          sw_vers

      - name: Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      # 作者工程里留着 DEVELOPMENT_TEAM = NDRWM8PEDE，CI 上拿不到这个团队，
      # 顺手抹掉，避免任何自动签名回落到别人的团队。
      - name: Strip author's development team
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = NDRWM8PEDE;//g' ios/Runner.xcodeproj/project.pbxproj
          grep -c DEVELOPMENT_TEAM ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS (Release, no codesign)
        env:
          LANG: en_US.UTF-8
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"

      - name: Package ipa
        run: |
          # 注意：这里不要用 set -u。macOS 自带 bash 3.2 会把 $VAR 紧跟的全角标点
          # 当成变量名的一部分，直接报 unbound variable。所有变量统一用 ${VAR} 包。
          set -eo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "${APP}" || { echo "::error::没有找到 ${APP}"; exit 1; }

          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist")
          BNO=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist")
          echo "version=${NAME} build=${BNO} bundle=${BID}"
          echo "--- arch ---"
          lipo -info "${APP}/Runner" || true
          echo "--- signature (expect unsigned) ---"
          codesign -dv "${APP}" 2>&1 || true
          echo "--- nested bundles ---"
          find "${APP}" -name "*.appex" -maxdepth 3 || echo "(none)"

          rm -rf Payload && mkdir -p Payload
          cp -R "${APP}" Payload/Runner.app
          find Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} + || true
          find Payload -name 'embedded.mobileprovision' -delete || true

          mkdir -p dist
          IPA="SegwayBLE-${NAME}-${BNO}-unsigned.ipa"
          zip -qry "dist/${IPA}" Payload
          echo "IPA=${IPA}" >> "${GITHUB_ENV}"

          # 原 bundle id 是 com.segway.research.app，多半已被作者团队注册，
          # 免费 Apple ID 签不上，这里再出一份改 id 的，Sideloadly 可直接签。
          # ipa 的根目录必须叫 Payload，所以单独开 staging 目录再进到里面打 zip。
          # 复制源要用已经剥过签名的 Payload/Runner.app，不要用 ${APP}，
          # 否则 Frameworks/*.framework/_CodeSignature 会被一起带进来。
          NEWID="com.liberty322.segwayble"
          IPA2="SegwayBLE-${NAME}-${BNO}-unsigned-reid.ipa"
          rm -rf reid && mkdir -p reid/Payload
          cp -R Payload/Runner.app reid/Payload/Runner.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${NEWID}" reid/Payload/Runner.app/Info.plist
          ( cd reid && zip -qry "../dist/${IPA2}" Payload )
          echo "IPA2=${IPA2}" >> "${GITHUB_ENV}"

          echo "--- 校验 ipa 根目录必须是 Payload/ ---"
          for f in dist/*.ipa; do
            head=$(unzip -Z1 "${f}" | head -1)
            case "${head}" in
              Payload/*) echo "OK   ${f}  -> ${head}" ;;
              *) echo "::error::${f} 的根目录是 ${head}，不是 Payload/"; exit 1 ;;
            esac
          done

          test -s "dist/${IPA}"  || { echo "::error::${IPA} 生成失败"; exit 1; }
          test -s "dist/${IPA2}" || { echo "::error::${IPA2} 生成失败"; exit 1; }

          {
            echo "ipa         : ${IPA}"
            echo "ipa (re-id) : ${IPA2}"
            echo "bundle id   : ${BID} -> ${NEWID}"
            echo "version     : ${NAME} (${BNO})"
            echo "flutter     : 3.41.6 / Dart 3.11.4"
            echo "runner      : macos-15"
            echo "commit      : $(git rev-parse HEAD)"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
          ls -lh dist

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: SegwayBLE-unsigned-IPA
          path: |
            dist/*.ipa
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: ${{ runner.temp }}/flutter-build.log
          if-no-files-found: ignore
          retention-days: 7
